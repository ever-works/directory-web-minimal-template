name: k8s-build
on:
  workflow_dispatch:
  push:
    branches: [develop, stage, main, master]
concurrency:
  group: k8s-build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
# docker/build-push-action uploads a build record artifact and a job summary for every build.
# The record holds every build-arg value in plain text, and on a public repo anyone signed in to
# GitHub can download it, so neither is produced. (BuildKit `secrets:` are never recorded.)
env:
  DOCKER_BUILD_RECORD_UPLOAD: false
  DOCKER_BUILD_SUMMARY: false

jobs:
  build:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: directory-web-minimal-template
            dockerfile: Dockerfile
            context: .
            build_args: ""
          # ever-static-dev demo images (docs.demo-minimal.ever.works +
          # {basic,git}.demo-minimal.ever.works). Building them here gives them
          # immutable sha-<sha> tags so ArgoCD Image Updater can pin the demos
          # off the mutable :dev tag.
          - image: directory-web-minimal-template-docs
            dockerfile: Dockerfile.docs
            context: .
            build_args: ""
          - image: directory-web-minimal-template-sample-basic
            dockerfile: Dockerfile.sample
            context: .
            build_args: |
              APP_PKG=@ever-works/sample-basic
              APP_DIR=sample-basic
          - image: directory-web-minimal-template-sample-git
            dockerfile: Dockerfile.sample
            context: .
            build_args: |
              APP_PKG=@ever-works/sample-git
              APP_DIR=sample-git
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: t
        run: |
          case "${GITHUB_REF_NAME}" in
            develop) echo "tag=dev" >> "$GITHUB_OUTPUT" ;;
            stage) echo "tag=stage" >> "$GITHUB_OUTPUT" ;;
            main|master) echo "tag=prod" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Route dep install through the internal Verdaccio VIP cache when the
          # org var is set (this workflow runs on our ARC runners, which can
          # reach it). Empty on forks / github-hosted builds -> public npm.
          # matrix.build_args carries per-image args (APP_PKG/APP_DIR for the
          # sample images); GITHUB_* feed the OCI source/revision labels.
          # DOCS_URL / DOCS_HOME_CANONICAL_PATH are the docs image's canonical origin and the
          # page a redirecting site root is sent to (Dockerfile.docs, apps/docs/docusaurus.config.ts).
          # They describe ONE deployment, so they come only from this repository's own Actions
          # variables, which the platform's template sync does not copy - this file names no
          # host - and reach the production (:prod) image only. Empty DOCS_URL builds a noindex
          # docs image that names no host. The other Dockerfiles ignore both.
          build-args: |
            VERDACCIO_REGISTRY=${{ vars.VERDACCIO_REGISTRY }}
            DOCS_URL=${{ steps.t.outputs.tag == 'prod' && vars.DOCS_URL || '' }}
            DOCS_HOME_CANONICAL_PATH=${{ steps.t.outputs.tag == 'prod' && vars.DOCS_HOME_CANONICAL_PATH || '' }}
            GITHUB_REPOSITORY=${{ github.repository }}
            GITHUB_SHA=${{ github.sha }}
            ${{ matrix.build_args }}
          # sample-git clones its data repo at build; pass a token to lift the
          # anonymous GitHub rate limit (other images ignore the empty mount).
          secrets: |
            gh_token=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.t.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max
